<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title><!-- TITLE --></title>
  <style>
    :root {
      --bg: #1e1e1e; --elev: #252526; --text: #e8e8e8;
      --muted: #9d9d9d; --dim: #6e6e6e; --line: #3c3c3c;
      --accent: #3794ff; --ok: #89d185; --warn: #cca700; --code: #9cdcfe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text); padding: 24px 28px 40px; max-width: 1120px;
    }
    h1 { font-size: 19px; font-weight: 600; margin: 0; }
    h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
    .sub { color: var(--muted); font-size: 12px; margin: 6px 0 16px; }
    .pills { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .pill {
      font-size: 11px; padding: 2px 8px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--muted);
    }
    .pill.blue { color: var(--accent); border-color: #2a5a8a; background: #1a2f45; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
    .stat { background: var(--elev); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .stat .v { font-size: 20px; font-weight: 600; }
    .stat .l { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .stat .v.blue { color: var(--accent); }
    .stat .v.ok { color: var(--ok); }
    .stat .v.warn { color: var(--warn); }
    .two { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; }
    @media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
    table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--dim); font-weight: 500; font-size: 10.5px; }
    td.n { width: 28px; color: var(--muted); }
    td.mod { width: 88px; color: var(--accent); white-space: nowrap; }
    td.code { color: var(--code); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; line-height: 1.45; }
    .card { background: var(--elev); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 11px; overflow: hidden; }
    .card-h { display: flex; justify-content: space-between; align-items: center; padding: 9px 10px 5px; font-size: 12.5px; font-weight: 600; }
    .card-h span { font-size: 10.5px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
    .hint { font-size: 11px; color: var(--dim); margin-top: 6px; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  </style>
</head>
<body>
  <!--
    用法：替换 TITLE / 标题 / 统计 / 两张改动表 / 各组用例表。
    单文件无外链，浏览器直接打开即可截图转发。
  -->
  <div class="pills">
    <h1><!-- H1：产品 · 改动与测试（交互 + 代码） --></h1>
    <span class="pill blue"><!-- 日期窗 --></span>
    <span class="pill"><!-- 分支 --></span>
  </div>
  <div class="sub">测试看「怎么测 / 怎样算过」；联调/开发看「代码期望」。</div>

  <div class="stats">
    <div class="stat"><div class="v blue"><!-- N --></div><div class="l">改动点</div></div>
    <div class="stat"><div class="v ok"><!-- N --></div><div class="l">测试项</div></div>
    <div class="stat"><div class="v warn">双栏</div><div class="l">交互 + 接口/代码</div></div>
  </div>

  <div class="two">
    <div>
      <h2>用户侧变化</h2>
      <div class="card">
        <table>
          <thead><tr><th>日期</th><th>模块</th><th>变化</th></tr></thead>
          <tbody><!-- rows --></tbody>
        </table>
      </div>
    </div>
    <div>
      <h2>代码 / 接口对照</h2>
      <div class="card">
        <table>
          <thead><tr><th>模块</th><th>实现要点</th></tr></thead>
          <tbody><!-- rows：实现要点用 class="code" --></tbody>
        </table>
      </div>
    </div>
  </div>

  <hr />
  <h2>测试清单</h2>
  <div class="sub" style="margin-top:-4px"><!-- 优先顺序 --></div>

  <!-- 每组一个 .card：表头固定 # | 怎么测 | 怎样算过 | 代码期望 -->
  <div class="card">
    <div class="card-h">一、…（必测） <span>N 项</span></div>
    <table>
      <thead><tr><th>#</th><th>怎么测</th><th>怎样算过</th><th>代码期望</th></tr></thead>
      <tbody>
        <tr>
          <td class="n">1</td>
          <td></td>
          <td></td>
          <td class="code"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="hint"><!-- 分支 · 代理角色 --></div>
</body>
</html>
