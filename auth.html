<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf9f5">
  <meta name="robots" content="noindex">
  <meta name="view-transition" content="same-origin">
  <title>订阅授权 — 至关重要</title>
  <script>
    (function () {
      try { if (localStorage.getItem("aoci-theme") === "dark") document.documentElement.classList.add("dark"); } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body>
  <div class="auth-page">
    <div id="toast" class="toast" role="status" aria-live="polite">
      <i data-lucide="check-circle" style="width:15px;height:15px;color:#d8e7b4"></i>
      <span id="toast-message"></span>
    </div>

    <header class="nav">
      <div class="nav-inner">
        <a class="brand" href="index.html" aria-label="至关重要 · 首页">
          <span class="brand-mark"><i data-lucide="sparkles" style="width:15px;height:15px"></i></span>
          <span class="brand-text">至关重要</span>
        </a>
        <div class="nav-actions" style="flex:none">
          <button id="themeSwitch" type="button" class="switch-btn" data-switch-button aria-label="切换为深色" aria-pressed="false"></button>
          <a href="index.html" class="btn btn-ghost btn-sm">
            <i data-lucide="arrow-left" style="width:13px;height:13px"></i><span>返回首页</span>
          </a>
        </div>
      </div>
    </header>

    <div id="formView" class="auth-main view">
      <div class="auth-grid">
        <div class="auth-copy">
          <h1>解锁订阅能力</h1>
          <p class="lead">
            能力索引中标记 <code>[PRO]</code> 的能力需要订阅。输入订阅码完成授权后，AI 助手即可读取这些能力。
          </p>
          <ul class="auth-points">
            <li><span class="auth-check"><i data-lucide="check" style="width:12px;height:12px"></i></span>AI 助手可直接读取全部 [PRO] 能力</li>
            <li><span class="auth-check"><i data-lucide="check" style="width:12px;height:12px"></i></span>仅限一台设备使用</li>
            <li><span class="auth-check"><i data-lucide="check" style="width:12px;height:12px"></i></span>续费后自动延长</li>
          </ul>
        </div>

        <form id="activateForm" class="auth-card">
          <div class="auth-card-head">
            <span class="status-dot"><span class="status-pip"></span>当前状态</span>
            <span class="status-chip">未授权</span>
          </div>

          <label class="auth-field">
            <span class="label-row">
              <span>订阅码 <span class="need">*</span></span>
              <span>AOCI-XXXX-XXXX-XXXX</span>
            </span>
            <input id="codeInput" required autocomplete="off" spellcheck="false" placeholder="AOCI-XXXX-XXXX-XXXX">
          </label>

          <label class="auth-field">
            <span class="label-row"><span>你主要用它来做什么？（选填）</span></span>
            <input id="purposeInput" maxlength="200" placeholder="例如：独立开发 iOS App、公司内部 AI 提效">
          </label>

          <button id="activateBtn" type="submit" class="btn btn-primary auth-submit">
            <i data-lucide="key-round" style="width:15px;height:15px"></i>
            <span id="activateText">验证并授权</span>
          </button>
          <p id="message" class="auth-error"></p>
        </form>
      </div>
    </div>

    <div id="successView" class="auth-main view hidden">
      <section class="auth-success">
        <div class="ok-mark"><i data-lucide="check" style="width:26px;height:26px"></i></div>
        <h2 id="successTitle">授权成功</h2>
        <p id="planInfo" class="plan"></p>

        <div class="cmd-box">
          <div class="cmd-head">
            <span>复制到终端运行一次即可</span>
            <div class="os-switch">
              <button type="button" data-os="unix" class="os-tab is-on">macOS / Linux</button>
              <button type="button" data-os="win" class="os-tab">Windows</button>
            </div>
          </div>
          <div class="cmd-row">
            <code id="licenseCmd"></code>
            <button id="copyCmdBtn" type="button" class="btn btn-primary btn-sm">
              <i data-lucide="copy" style="width:13px;height:13px"></i><span>复制</span>
            </button>
          </div>
          <p id="boundNotice" class="bound-note">此订阅码已在一台设备上激活。</p>
        </div>

        <div class="success-actions">
          <a href="index.html" class="btn btn-primary"><i data-lucide="home" style="width:14px;height:14px"></i>返回首页</a>
          <button id="changeCodeBtn" type="button" class="btn btn-ghost">换一个订阅码</button>
        </div>
      </section>
    </div>

    <footer class="footer">
      <div class="footer-brand"><span>至关重要</span><span>·</span><span>订阅授权</span></div>
      <span>还没有订阅码？请通过 <a href="https://github.com/CCharlie-xiu" target="_blank" rel="noopener">GitHub</a> 联系作者获取。</span>
    </footer>
  </div>

  <script src="assets/js/icons.js" defer></script>
  <script src="assets/js/switch-button.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
</body>
</html>
